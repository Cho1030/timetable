<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="타임테이블">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<title>타임테이블</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  padding:10px;
  font-family: Arial, sans-serif;
  background:#f9f9f9;
  transition: background 0.3s;
}

.title{
  display:flex;
  justify-content:center;
  align-items:baseline;
  gap:10px;
  margin-bottom:6px;
}
.title h2{ margin:0; font-size:18px; }
#nowTime{ font-size:26px; font-weight:900; color:#d32f2f; }

.controls{
  text-align:center;
  margin-bottom:6px;
}
.controls input,
.controls select{
  font-size:14px;
  padding:4px;
  width:70px;
  margin:2px;
  text-align:center;
}

#container{
  position:relative;
  width:260px;
  height:260px;
  margin:0 auto;
}

#square{
  position:absolute;
  top:20px;
  left:20px;
  width:220px;
  height:220px;
  border:3px solid #3f51b5;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  box-sizing:border-box;
}

.time{
  background:#e3f2fd;
  border-radius:10px;
  padding:3px 8px;
  margin:2px 0;
  font-size:13px;
  white-space:nowrap;
}

.top-left,
.bottom-left{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  padding-left:4px;
  text-align:left;
}

.top-right,
.bottom-right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  padding-right:4px;
  text-align:right;
}

.bottom-left,
.bottom-right{
  justify-content: flex-end;
}

/* 코너 버튼 영역: 메인 버튼 + 시작 버튼을 같이 묶는 wrapper */
.corner-wrap {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 3px;
}

/* 위치 */
.corner-wrap.tl { top:0; left:0; transform: translate(-50%, -50%); flex-direction: row-reverse; }
.corner-wrap.tr { top:0; right:0; transform: translate(50%, -50%); flex-direction: row; }
.corner-wrap.br { bottom:0; right:0; transform: translate(50%, 50%); flex-direction: row; }
.corner-wrap.bl { bottom:0; left:0; transform: translate(-50%, 50%); flex-direction: row-reverse; }

.corner-btn{
  font-size:12px;
  padding:4px 8px;
  border-radius:6px;
  border:2px solid #3f51b5;
  background:#fff;
  cursor:pointer;
  white-space:nowrap;
  min-width: 36px;
}

/* 시작 버튼 */
.start-btn {
  font-size:11px;
  padding:3px 6px;
  border-radius:5px;
  border:1px solid #888;
  background:#f0f0f0;
  cursor:pointer;
  white-space:nowrap;
  min-width: 28px;
  color: #555;
}
.start-btn:hover {
  background: #ddd;
}

/* 요일 표시 상태 */
.corner-btn.day-thu { background: #e8eaf6; border-color: #3f51b5; color: #1a237e; font-weight: bold; }
.corner-btn.day-fri { background: #e8eaf6; border-color: #3f51b5; color: #1a237e; font-weight: bold; }
.corner-btn.day-sat { background: #e91e63; border-color: #880e4f; color: #fff; font-weight: bold; }
.corner-btn.day-sun { background: #f44336; border-color: #b71c1c; color: #fff; font-weight: bold; }

/* 시작 버튼 - 활성화된 코너 */
.start-btn.active-start {
  background: #3f51b5;
  color: white;
  border-color: #3f51b5;
}

.expired { color: #999; background: #eee; text-decoration: line-through; }
.current-nearest { background: #ffeb3b; font-weight: bold; }
.entry-highlight { background: #c8e6c9; font-weight: bold; }

.alarm-controls {
  margin-top: 50px;
  text-align: center;
}
.alarm-btn {
  font-size: 14px;
  padding: 8px 12px;
  margin: 5px;
  border-radius: 6px;
  border: 2px solid #3f51b5;
  background: #fff;
  cursor: pointer;
}
.alarm-btn.active {
  background: #3f51b5;
  color: white;
}
</style>
</head>

<body>

<div class="title">
  <h2>📋 타임테이블</h2>
  <span id="nowTime">--:--:--</span>
</div>

<div class="controls">
  <input id="startTime" placeholder="1000" maxlength="4">
  <select id="startCorner">
    <option value="0">좌상</option>
    <option value="1">우상</option>
    <option value="2">우하</option>
    <option value="3">좌하</option>
  </select>
</div>

<div id="container">
  <div id="square">
    <div class="top-left" id="c0"></div>
    <div class="top-right" id="c1"></div>
    <div class="bottom-left" id="c3"></div>
    <div class="bottom-right" id="c2"></div>
  </div>

  <!-- 좌상 (corner 0) -->
  <div class="corner-wrap tl">
    <button class="corner-btn" id="mainBtn0" onclick="highlightEntry(0)">메인</button>
    <button class="start-btn" id="startBtn0" onclick="activateDayStart(0)">시작</button>
  </div>

  <!-- 우상 (corner 1) -->
  <div class="corner-wrap tr">
    <button class="corner-btn" id="mainBtn1" onclick="highlightEntry(1)">메인</button>
    <button class="start-btn" id="startBtn1" onclick="activateDayStart(1)">시작</button>
  </div>

  <!-- 우하 (corner 2) -->
  <div class="corner-wrap br">
    <button class="corner-btn" id="mainBtn2" onclick="highlightEntry(2)">메인</button>
    <button class="start-btn" id="startBtn2" onclick="activateDayStart(2)">시작</button>
  </div>

  <!-- 좌하 (corner 3) -->
  <div class="corner-wrap bl">
    <button class="corner-btn" id="mainBtn3" onclick="highlightEntry(3)">메인</button>
    <button class="start-btn" id="startBtn3" onclick="activateDayStart(3)">시작</button>
  </div>
</div>

<div class="alarm-controls">
  <button id="alarmOn" class="alarm-btn" onclick="toggleAlarm(true)">🔔 알람 시작</button>
  <button id="alarmOff" class="alarm-btn active" onclick="toggleAlarm(false)">🔕 알람 종료</button>
</div>

<script>
// ── 상태 ──────────────────────────────────────────
let activeEntries = new Set();

// 코너: 0=좌상, 1=우상, 2=우하, 3=좌하
// 각 시작 코너별 목→금→토→일 순서
const DAY_ORDER = {
  0: [0, 3, 1, 2], // 좌상: 좌상→좌하→우상→우하
  3: [3, 0, 2, 1], // 좌하: 좌하→좌상→우하→우상
  1: [1, 2, 0, 3], // 우상: 우상→우하→좌상→좌하
  2: [2, 1, 3, 0], // 우하: 우하→우상→좌하→좌상
};

// 요일 배열
const DAYS = ['목', '금', '토', '일'];
const DAY_CLASSES = ['day-thu', 'day-fri', 'day-sat', 'day-sun'];

// dayStartCorner: 몇 번 코너가 '목'인지 (-1이면 비활성)
let dayStartCorner = -1;

const order = [
  [0,1,2,3],
  [1,2,3,0],
  [2,3,0,1],
  [3,0,1,2]
];

const input = document.getElementById("startTime");
const select = document.getElementById("startCorner");

// ── localStorage 로드 ──────────────────────────────
function loadState() {
  const saved = localStorage.getItem('timetable_state');
  if (saved) {
    try {
      const s = JSON.parse(saved);
      if (s.startTime !== undefined) input.value = s.startTime;
      if (s.startCorner !== undefined) select.value = s.startCorner;
      if (s.dayStartCorner !== undefined) dayStartCorner = s.dayStartCorner;
    } catch(e) {}
  }
  // 기본값
  if (!input.value) input.value = '1000';
}

function saveState() {
  localStorage.setItem('timetable_state', JSON.stringify({
    startTime: input.value,
    startCorner: select.value,
    dayStartCorner: dayStartCorner
  }));
}

// ── 요일 버튼 렌더 ────────────────────────────────
function renderDayButtons() {
  for (let i = 0; i < 4; i++) {
    const btn = document.getElementById('mainBtn' + i);
    const sBtn = document.getElementById('startBtn' + i);

    // 기존 day 클래스 제거
    DAY_CLASSES.forEach(c => btn.classList.remove(c));
    sBtn.classList.remove('active-start');

    if (dayStartCorner === -1) {
      btn.textContent = '메인';
    } else {
      const seq = DAY_ORDER[dayStartCorner];
      const offset = seq.indexOf(i); // 0=목, 1=금, 2=토, 3=일

      btn.textContent = DAYS[offset];
      btn.classList.add(DAY_CLASSES[offset]);

      if (i === dayStartCorner) {
        sBtn.classList.add('active-start');
      }
    }
  }
}

// 시작 버튼 클릭
function activateDayStart(corner) {
  dayStartCorner = corner;
  renderDayButtons();
  saveState();
}

// ── 타임테이블 그리기 ──────────────────────────────
function draw(){
  const v = input.value;
  if(v.length!==4) return;
  const h=parseInt(v.slice(0,2));
  const m=parseInt(v.slice(2,4));
  if(h>23||m>59) return;

  document.querySelectorAll("#square > div").forEach(d=>d.innerHTML="");

  let t=new Date();
  t.setHours(h,m,0,0);

  let end=new Date();
  end.setHours(18,0,0,0);

  let i=0;
  while(t<=end){
    const d=document.createElement("div");
    d.className="time";
    d.innerText=t.toTimeString().slice(0,5);
    d.dataset.time = t.getTime();
    document.getElementById("c"+order[select.value][i%4]).appendChild(d);
    t=new Date(t.getTime()+40*60000);
    i++;
  }
  saveState();
}

input.addEventListener("input", draw);
select.addEventListener("change", draw);

// ── 현재 시간 ────────────────────────────────────
function updateNow(){
  const n=new Date();
  document.getElementById("nowTime").innerText=
    String(n.getHours()).padStart(2,"0")+":"+
    String(n.getMinutes()).padStart(2,"0")+":"+
    String(n.getSeconds()).padStart(2,"0");
}
setInterval(updateNow,1000);
updateNow();

// ── 시간 상태 업데이트 ────────────────────────────
function updateTimeStatus(){
  const now = Date.now();
  const times = document.querySelectorAll(".time");
  let nearestPast = null;
  let nearestDiff = Infinity;

  times.forEach(el => {
    const t = parseInt(el.dataset.time);
    el.classList.remove("expired", "current-nearest");
    if(t < now){
      el.classList.add("expired");
      const diff = now - t;
      if(diff < nearestDiff){ nearestDiff = diff; nearestPast = el; }
    }
  });

  if(nearestPast){
    nearestPast.classList.remove("expired");
    nearestPast.classList.add("current-nearest");
  }
  checkAlarm();
}
setInterval(updateTimeStatus, 1000);

// ── 입구 하이라이트 ──────────────────────────────
function highlightEntry(corner){
  const protectedItem = document.querySelector(".current-nearest");
  if(activeEntries.has(corner)){
    document.querySelectorAll("#c"+corner+" .entry-highlight")
      .forEach(e => e.classList.remove("entry-highlight"));
    activeEntries.delete(corner);
    return;
  }
  activeEntries.add(corner);
  const now = Date.now();
  const list = [...document.querySelectorAll("#c"+corner+" .time")]
    .filter(el => el !== protectedItem)
    .map(el => ({ el, diff: Math.abs(now - parseInt(el.dataset.time)) }))
    .sort((a,b)=>a.diff-b.diff)
    .slice(0,3);
  list.forEach(o => o.el.classList.add("entry-highlight"));
}

// ── 알람 ─────────────────────────────────────────
let isAlarmEnabled = false;
let lastAlarmMinuteMark = -1;
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playBeep(count) {
  if (count <= 0) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = "sine";
  osc.frequency.setValueAtTime(880, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.5);
  osc.onended = () => { setTimeout(() => playBeep(count - 1), 500); };
}

function triggerAlarmEffects() {
  if (navigator.vibrate) navigator.vibrate(5000);
  playBeep(3);
  document.body.style.backgroundColor = "#ffcdd2";
  setTimeout(() => {
    if (document.body.style.backgroundColor === "rgb(255, 205, 210)") {
      document.body.style.backgroundColor = "#f9f9f9";
    }
  }, 180000);
}

function toggleAlarm(status) {
  isAlarmEnabled = status;
  document.getElementById('alarmOn').classList.toggle('active', status);
  document.getElementById('alarmOff').classList.toggle('active', !status);
  if(status) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } else {
    document.body.style.backgroundColor = "#f9f9f9";
  }
}

function checkAlarm() {
  if (!isAlarmEnabled) return;
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  if (h >= 10 && h < 18) {
    if (m % 20 === 0 && m !== lastAlarmMinuteMark) {
      triggerAlarmEffects();
      lastAlarmMinuteMark = m;
    }
  }
}

// ── 초기화 ───────────────────────────────────────
loadState();
draw();
renderDayButtons();
</script>

</body>
</html>
